name: Keep Supabase Alive

# Supabase's free tier pauses a project after 7 days with no real
# database activity. This runs twice a week (Sunday and Wednesday) —
# a 4-day max gap, well under the threshold, with enough margin that
# a single missed/delayed run (GitHub Actions scheduling isn't always
# exact) still won't let a full week pass with nothing happening.
#
# It queries app_meta (a real, tiny single-row table) rather than just
# hitting a cached endpoint — Supabase counts actual database queries
# as activity, not just any API request.

on:
  schedule:
    - cron: '0 3 * * 0,3'  # 3am UTC, Sunday and Wednesday
  workflow_dispatch: {}     # lets you trigger it manually to test it works

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hhacsbkjtfunwteqoghp.supabase.co/rest/v1/app_meta?select=id&limit=1" \
            -H "apikey: sb_publishable_7YaoK4yFofDPej1Rm0kq8g_x0t5_utb" \
            -H "Authorization: Bearer sb_publishable_7YaoK4yFofDPej1Rm0kq8g_x0t5_utb")
          echo "Supabase responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Supabase ping returned an error status — check the project isn't already paused, or that the key in this workflow still matches config.js"
          fi
